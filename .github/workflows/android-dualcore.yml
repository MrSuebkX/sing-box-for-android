name: Android DualTunnel

on:
  push:
    branches: [feature/mihomo-clash-subscriptions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dualcore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;28.0.13004108'
      - name: Checkout matching sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: core-source
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: dualcore-go-arm64-${{ hashFiles('core-source/go.sum') }}
      - name: Build Android VPN library
        working-directory: core-source
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
          GOMAXPROCS: '2'
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/
      - name: Download and verify official mihomo Android core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-android-arm64-v8-v1.19.33.gz -o "$RUNNER_TEMP/mihomo.gz"
          echo '2ddbd3aaa884f52b4568f406876ec81dddeef9f1bb67b90d4004d356e2c6a708  '"$RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libmihomo.so
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and compile installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testOtherDebugUnitTest :app:assembleOtherDebug
      - name: Verify packaged cores and calculate checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/other/debug/*arm64-v8a*.apk dist/
          for apk in dist/*.apk; do
            unzip -l "$apk" | grep 'lib/arm64-v8a/libmihomo.so'
            unzip -l "$apk" | grep 'lib/arm64-v8a/libbox.so'
          done
          cp DUALCORE.md dist/
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DualTunnel-arm64-v8a
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

